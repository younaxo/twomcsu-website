name: twomcsu

services:
  postgres:
    image: postgres:16-alpine
    container_name: twomc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minecraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minecraft}
      POSTGRES_DB: ${POSTGRES_DB:-minecraft_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - twomc

  redis:
    image: redis:7-alpine
    container_name: twomc-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - twomc

volumes:
  postgres-data:
  redis-data:

networks:
  twomc:
    driver: bridge
